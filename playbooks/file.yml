---

- name: create file
  hosts: webhooks

  tasks:
  - name: create a file
    file:
      path: /home/ubuntu/file.txt
      state: touch
      #state: absent # For delete file 
      owner: ubuntu
      group: ubuntu
      mode: u=rwx,g=rw,o=r
  - name: create directory
    file:
      path: /home/ubuntu/demo
      state: directory
      #state: absent # For delete directory
